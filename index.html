<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毛茸茸 · 萌宠分享站</title>
<style>
  /* ========== 基础 ========== */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root{
    --pink:      #FF9FB2;
    --pink-deep: #FF7D9C;
    --pink-soft: #FFE3EA;
    --cream:     #FFF8F3;
    --ink:       #4A3B47;
    --muted:     #93828C;
    --radius:    26px;
  }

  html { scroll-behavior: smooth; }

  body{
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--cream);
    color: var(--ink);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* 背景小圆点 */
  body::before{
    content:"";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(#FFD9E3 1.6px, transparent 1.6px);
    background-size: 26px 26px;
    opacity: .6;
    pointer-events: none;
    z-index: 0;
  }

  main, header, footer { position: relative; z-index: 1; }

  /* ========== 顶部导航 ========== */
  header{
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    background: rgba(255, 248, 243, .8);
    border-bottom: 1px solid rgba(255, 159, 178, .22);
    transition: box-shadow .3s;
  }
  header.scrolled{ box-shadow: 0 6px 22px rgba(255, 159, 178, .14); }

  .nav{
    max-width: 1164px;
    margin: 0 auto;
    padding: 13px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .logo{
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: .5px;
  }
  .logo .paw{
    font-size: 25px;
    display: inline-block;
    animation: wag 2.6s ease-in-out infinite;
  }
  @keyframes wag{
    0%,100%{ transform: rotate(-12deg) scale(1); }
    50%    { transform: rotate(12deg) scale(1.12); }
  }

  .nav-links{ display: flex; gap: 6px; }
  .nav-links a{
    text-decoration: none;
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 999px;
    transition: .25s;
  }
  .nav-links a:hover{ color: var(--pink-deep); background: var(--pink-soft); }

  /* ========== Hero ========== */
  .hero{
    position: relative;
    max-width: 1164px;
    margin: 0 auto;
    padding: 78px 22px 62px;
    text-align: center;
  }

  .paw{
    position: absolute;
    font-size: 34px;
    opacity: .32;
    user-select: none;
    pointer-events: none;
    animation: float 6s ease-in-out infinite;
  }
  .paw.p1{ left: 5%;  top: 18%;  animation-delay: 0s;   }
  .paw.p2{ right: 7%; top: 14%;  animation-delay: 1.2s; font-size: 27px; }
  .paw.p3{ left: 11%; bottom: 12%; animation-delay: 2.1s; font-size: 23px; }
  .paw.p4{ right: 13%; bottom: 18%; animation-delay: .7s; font-size: 40px; opacity: .22; }

  @keyframes float{
    0%,100%{ transform: translateY(0) rotate(-8deg); }
    50%    { transform: translateY(-16px) rotate(8deg); }
  }

  .badge-pill{
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: #fff;
    border: 1.5px solid var(--pink-soft);
    color: var(--pink-deep);
    font-size: 13px;
    font-weight: 800;
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 24px;
    box-shadow: 0 6px 18px rgba(255, 159, 178, .16);
  }

  .hero h1{
    font-size: clamp(32px, 6vw, 58px);
    line-height: 1.16;
    font-weight: 900;
    letter-spacing: -.5px;
    margin-bottom: 18px;
  }
  .hero h1 .grad{
    background: linear-gradient(115deg, #FF9FB2 0%, #FFB86B 48%, #C6B4F0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hero p.sub{
    max-width: 520px;
    margin: 0 auto 34px;
    font-size: 15.5px;
    line-height: 1.85;
    color: var(--muted);
  }

  .hero-actions{
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 30px;
    border-radius: 999px;
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: transform .25s cubic-bezier(.2,.8,.3,1), box-shadow .25s, background .25s;
  }
  .btn-primary{
    background: linear-gradient(135deg, #FF9FB2, #FF7D9C);
    color: #fff;
    box-shadow: 0 12px 26px rgba(255, 125, 156, .38);
  }
  .btn-primary:hover{ transform: translateY(-3px); box-shadow: 0 18px 34px rgba(255, 125, 156, .46); }
  .btn-primary:active{ transform: translateY(-1px) scale(.98); }

  .btn-ghost{
    background: #fff;
    color: var(--ink);
    border: 1.5px solid var(--pink-soft);
    box-shadow: 0 8px 20px rgba(74, 59, 71, .07);
  }
  .btn-ghost:hover{ transform: translateY(-3px); box-shadow: 0 14px 28px rgba(74, 59, 71, .11); }

  /* ========== 区块标题 ========== */
  .sec-head{
    max-width: 1164px;
    margin: 0 auto 30px;
    padding: 0 22px;
    text-align: center;
  }
  .sec-head h2{
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 900;
    margin-bottom: 10px;
    letter-spacing: -.3px;
  }
  .sec-head p{ color: var(--muted); font-size: 14.5px; }

  /* ========== 筛选 ========== */
  .filters{
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 0 0 38px;
    padding: 0 22px;
  }
  .chip{
    padding: 10px 24px;
    border-radius: 999px;
    border: 1.5px solid var(--pink-soft);
    background: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    color: var(--muted);
    cursor: pointer;
    transition: .25s;
  }
  .chip:hover{ color: var(--ink); border-color: #FFC2D1; transform: translateY(-2px); }
  .chip.active{
    background: linear-gradient(135deg, #FF9FB2, #FF7D9C);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 10px 22px rgba(255, 125, 156, .32);
  }

  /* ========== 卡片网格 ========== */
  .grid{
    max-width: 1164px;
    margin: 0 auto;
    padding: 0 22px 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
    gap: 26px;
  }

  .card{
    background: #fff;
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 26px rgba(74, 59, 71, .08);
    transition: transform .38s cubic-bezier(.2,.8,.3,1), box-shadow .38s;
    animation: pop .55s cubic-bezier(.2,.8,.3,1) backwards;
  }
  .card:hover{
    transform: translateY(-9px);
    box-shadow: 0 24px 48px rgba(255, 125, 156, .26);
  }
  @keyframes pop{
    from{ opacity: 0; transform: translateY(20px) scale(.95); }
    to  { opacity: 1; transform: none; }
  }

  .card-media{
    position: relative;
    aspect-ratio: 5 / 4;
    display: grid;
    place-items: center;
    background: linear-gradient(140deg, var(--c1), var(--c2));
    overflow: hidden;
  }
  .pet-emoji{
    font-size: 84px;
    line-height: 1;
    filter: drop-shadow(0 10px 16px rgba(0, 0, 0, .13));
    transition: transform .45s cubic-bezier(.2,.8,.3,1);
  }
  .card:hover .pet-emoji{ transform: scale(1.13) rotate(-6deg); }

  .card-media::after{
    content: "";
    position: absolute;
    inset: auto -20% -60% -20%;
    height: 90%;
    background: radial-gradient(ellipse at center, rgba(255,255,255,.55), transparent 70%);
    pointer-events: none;
  }

  .tag{
    position: absolute;
    top: 14px;
    left: 14px;
    background: rgba(255, 255, 255, .88);
    backdrop-filter: blur(6px);
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 900;
    color: var(--pink-deep);
    letter-spacing: .5px;
    z-index: 2;
  }

  .card-body{
    padding: 18px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .card-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .card-head h3{ font-size: 19px; font-weight: 900; }

  .meta{ font-size: 12.5px; color: var(--muted); font-weight: 700; letter-spacing: .3px; }
  .desc{ font-size: 13.5px; line-height: 1.7; color: #6E5F68; flex: 1; }

  /* 点赞按钮 */
  .like{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #FFF5F8;
    border: none;
    border-radius: 999px;
    padding: 6px 13px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 900;
    color: var(--pink-deep);
    transition: background .25s, transform .25s;
    flex-shrink: 0;
  }
  .like:hover{ background: var(--pink-soft); transform: scale(1.06); }
  .like .heart{
    width: 15px;
    height: 15px;
    fill: none;
    stroke: var(--pink-deep);
    stroke-width: 2;
    transition: fill .25s, stroke .25s;
    transform-origin: center;
  }
  .like.liked{ background: var(--pink-soft); }
  .like.liked .heart{ fill: #FF5C86; stroke: #FF5C86; }
  .like.pop .heart{ animation: beat .5s cubic-bezier(.2,.8,.3,1); }
  @keyframes beat{
    0%  { transform: scale(1); }
    35% { transform: scale(1.55); }
    70% { transform: scale(.9); }
    100%{ transform: scale(1); }
  }

  /* ========== CTA ========== */
  .cta{
    max-width: 1164px;
    margin: 84px auto;
    padding: 0 22px;
  }
  .cta-inner{
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #FFE3EA 0%, #FFF0CF 52%, #E4E9FF 100%);
    border-radius: 34px;
    padding: 60px 32px;
    text-align: center;
  }
  .cta-inner::before,
  .cta-inner::after{
    content: "🐾";
    position: absolute;
    font-size: 130px;
    opacity: .13;
    pointer-events: none;
  }
  .cta-inner::before{ left: -20px;  top: -30px;  transform: rotate(-18deg); }
  .cta-inner::after { right: -16px; bottom: -46px; transform: rotate(14deg); }

  .cta-inner h2{
    font-size: clamp(23px, 4vw, 32px);
    font-weight: 900;
    margin-bottom: 12px;
  }
  .cta-inner p{
    color: #7A6670;
    font-size: 14.5px;
    line-height: 1.8;
    max-width: 460px;
    margin: 0 auto 28px;
  }

  /* ========== 页脚 ========== */
  footer{
    text-align: center;
    padding: 34px 22px 44px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.9;
    border-top: 1px solid rgba(255, 159, 178, .2);
    background: rgba(255, 255, 255, .5);
  }
  footer .foot-paws{ font-size: 17px; letter-spacing: 6px; margin-bottom: 8px; }

  /* ========== Toast ========== */
  .toast{
    position: fixed;
    left: 50%;
    bottom: 36px;
    transform: translate(-50%, 160%);
    background: var(--ink);
    color: #fff;
    padding: 14px 26px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 16px 34px rgba(74, 59, 71, .3);
    transition: transform .45s cubic-bezier(.2,.8,.3,1);
    z-index: 200;
    white-space: nowrap;
  }
  .toast.show{ transform: translate(-50%, 0); }

  /* ========== 滚动出现 ========== */
  .reveal{
    opacity: 0;
    transform: translateY(26px);
    transition: opacity .75s cubic-bezier(.2,.8,.3,1), transform .75s cubic-bezier(.2,.8,.3,1);
  }
  .reveal.in{ opacity: 1; transform: none; }

  /* ========== 响应式 ========== */
  @media (max-width: 720px){
    .nav-links{ display: none; }
    .hero{ padding: 52px 20px 44px; }
    .paw.p2, .paw.p3{ display: none; }
    .grid{ gap: 20px; }
    .cta{ margin: 62px auto; }
    .cta-inner{ padding: 46px 22px; border-radius: 28px; }
    .cta-inner::before, .cta-inner::after{ font-size: 90px; }
    .btn{ padding: 13px 24px; font-size: 14px; }
  }
</style>
</head>
<body>

<!-- ========== 导航 ========== -->
<header id="siteHeader">
  <nav class="nav">
    <div class="logo">
      <span class="paw">🐾</span>
      <span>毛茸茸</span>
    </div>
    <div class="nav-links">
      <a href="#gallery">萌宠墙</a>
      <a href="#share">来分享</a>
      <a href="#about">关于我们</a>
    </div>
  </nav>
</header>

<main>

  <!-- ========== Hero ========== -->
  <section class="hero">
    <span class="paw p1">🐾</span>
    <span class="paw p2">🐾</span>
    <span class="paw p3">🐾</span>
    <span class="paw p4">🐾</span>

    <div class="badge-pill">🐶 领养代替购买 · 给它们一个家 🐱</div>

    <h1>遇见你的<br><span class="grad">毛茸茸小可爱</span></h1>

    <p class="sub">
      在这里，每一只猫咪和狗狗都有自己的小故事。<br>
      来逛逛它们的日常，或者把你家宝贝的可爱瞬间分享给更多人吧。
    </p>

    <div class="hero-actions">
      <button class="btn btn-primary" onclick="scrollToGallery()">🐾 看看萌宠</button>
      <button class="btn btn-ghost" onclick="showToast('分享功能正在打盹… 先看看萌宠吧 🐱')">📸 分享我的宝贝</button>
    </div>
  </section>

  <!-- ========== 萌宠墙 ========== -->
  <section id="gallery">
    <div class="sec-head reveal">
      <h2>今日萌宠墙 ✨</h2>
      <p>每一只都超想被你摸一摸脑袋</p>
    </div>

    <div class="filters reveal">
      <button class="chip active" data-filter="all">🐾 全部</button>
      <button class="chip" data-filter="cat">🐱 猫咪</button>
      <button class="chip" data-filter="dog">🐶 狗狗</button>
    </div>

    <div class="grid" id="grid"></div>
  </section>

  <!-- ========== CTA ========== -->
  <section class="cta reveal" id="share">
    <div class="cta-inner">
      <h2>把你家毛孩子的可爱分享出来吧</h2>
      <p>一张照片、一句吐槽、一段小日常——都可能治愈屏幕另一端的人。</p>
      <button class="btn btn-primary" onclick="showToast('谢谢你的分享！(演示按钮 🐾)')">我要投稿 🐾</button>
    </div>
  </section>

</main>

<!-- ========== 页脚 ========== -->
<footer id="about">
  <div class="foot-paws">🐾 🐾 🐾</div>
  <div>毛茸茸 · 一个温柔的小小萌宠分享站</div>
  <div>用爱发电 · 愿每只小动物都被温柔以待</div>
</footer>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  /* ---------- 数据 ---------- */
  const pets = [
    {
      name: '奶糖', type: 'cat', emoji: '🐱',
      breed: '英短蓝白', age: '1 岁',
      desc: '一叫就来，超爱撒娇，最喜欢趴在我的键盘上陪我加班。',
      likes: 328, c1: '#FFE0EA', c2: '#FFC2D1'
    },
    {
      name: '布丁', type: 'dog', emoji: '🐶',
      breed: '柯基', age: '2 岁',
      desc: '小短腿跑起来像一块弹跳的小面包，见谁都摇尾巴。',
      likes: 512, c1: '#FFF0CF', c2: '#FFD98E'
    },
    {
      name: '糯米', type: 'cat', emoji: '🐈',
      breed: '布偶猫', age: '3 岁',
      desc: '蓝眼睛的温柔大猫，被抱在怀里就会发出呼噜呼噜的声音。',
      likes: 441, c1: '#E4E9FF', c2: '#C6B4F0'
    },
    {
      name: '芝麻', type: 'dog', emoji: '🐕',
      breed: '柴犬', age: '1 岁',
      desc: '行走的表情包制造机，散步时永远要走在最前面。',
      likes: 289, c1: '#FFE6D6', c2: '#FFB98A'
    },
    {
      name: '团子', type: 'cat', emoji: '🐈',
      breed: '孟买黑猫', age: '2 岁',
      desc: '黑夜里只见两只圆眼睛，其实特别黏人，走哪跟哪。',
      likes: 376, c1: '#E2E8EC', c2: '#B9C6D1'
    },
    {
      name: '可乐', type: 'dog', emoji: '🐩',
      breed: '比熊', age: '4 岁',
      desc: '一团会走路的棉花糖，掉毛少、饭量大、撒娇第一名。',
      likes: 198, c1: '#E0F7EE', c2: '#9FE3C9'
    },
    {
      name: '汤圆', type: 'cat', emoji: '😻',
      breed: '橘猫', age: '5 岁',
      desc: '体重十斤，九斤是饭。但冬天抱着睡觉真的超暖和。',
      likes: 624, c1: '#FFF1DC', c2: '#FFC98B'
    },
    {
      name: '豆豆', type: 'dog', emoji: '🦮',
      breed: '金毛', age: '3 岁',
      desc: '温柔的大暖男，会帮我把掉在地上的袜子叼回沙发上。',
      likes: 455, c1: '#FFF6DF', c2: '#FFD9A0'
    }
  ];

  /* ---------- 渲染 ---------- */
  const grid = document.getElementById('grid');

  const heartSVG = `
    <svg class="heart" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 20.4S3.9 15.4 2.7 10.7A5.2 5.2 0 0 1 12 6.4a5.2 5.2 0 0 1 9.3 4.3C20.1 15.4 12 20.4 12 20.4z"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;

  function render(filter = 'all') {
    const list = pets.filter(p => filter === 'all' || p.type === filter);

    grid.innerHTML = list.map((p, i) => `
      <article class="card" style="animation-delay:${i * 70}ms">
        <div class="card-media" style="--c1:${p.c1}; --c2:${p.c2}">
          <span class="tag">${p.type === 'cat' ? '🐱 猫咪' : '🐶 狗狗'}</span>
          <span class="pet-emoji">${p.emoji}</span>
        </div>
        <div class="card-body">
          <div class="card-head">
            <h3>${p.name}</h3>
            <button class="like" data-liked="false" aria-label="喜欢 ${p.name}">
              ${heartSVG}<span class="count">${p.likes}</span>
            </button>
          </div>
          <p class="meta">${p.breed} · ${p.age}</p>
          <p class="desc">${p.desc}</p>
        </div>
      </article>
    `).join('');
  }

  render();

  /* ---------- 筛选 ---------- */
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      render(chip.dataset.filter);
    });
  });

  /* ---------- 点赞（事件委托） ---------- */
  grid.addEventListener('click', e => {
    const btn = e.target.closest('.like');
    if (!btn) return;

    const liked   = btn.dataset.liked === 'true';
    const countEl = btn.querySelector('.count');
    let n = parseInt(countEl.textContent, 10);

    btn.dataset.liked = String(!liked);
    btn.classList.toggle('liked', !liked);
    countEl.textContent = liked ? n - 1 : n + 1;

    btn.classList.remove('pop');
    void btn.offsetWidth;   // 强制重排，让动画可重复播放
    btn.classList.add('pop');

    if (!liked) showToast(`你摸了摸 ${btn.closest('.card').querySelector('h3').textContent} 的头 🐾`);
  });

  /* ---------- Toast ---------- */
  const toastEl = document.getElementById('toast');
  let toastTimer;

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  /* ---------- 滚动出现 ---------- */
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        en.target.classList.add('in');
        io.unobserve(en.target);
      }
    });
  }, { threshold: .12 });

  document.querySelectorAll('.reveal').forEach(el => io.observe(el));

  /* ---------- 导航阴影 ---------- */
  const header = document.getElementById('siteHeader');
  window.addEventListener('scroll', () => {
    header.classList.toggle('scrolled', window.scrollY > 12);
  }, { passive: true });

  /* ---------- 平滑滚动 ---------- */
  function scrollToGallery() {
    document.getElementById('gallery').scrollIntoView({ behavior: 'smooth' });
  }
</script>
